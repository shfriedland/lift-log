<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#0e1013">
<title>Lift Log</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e1013;--card:#171a1f;--card2:#21252c;--line:#2b3039;--text:#eef0f3;--mut:#8b93a1;--acc:#c6f432;--accT:#11140a;--red:#ff6b6b;--doneBg:rgba(198,244,50,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Segoe UI,Roboto,sans-serif}
body{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:#5d6470}
textarea{resize:none;min-height:42px}
#top{position:sticky;top:0;z-index:5;background:rgba(14,16,19,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);min-height:56px}
#top h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
#top .back{color:var(--acc);font-weight:600;flex:1;text-align:left;font-size:17px}
#top .backIcon{color:var(--acc);font-size:30px;line-height:1;padding:0 6px 4px 0}
#top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .wtitle{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
#top .wtitle b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .wtitle span{font-size:13px;color:var(--acc);font-variant-numeric:tabular-nums}
.sync{width:10px;height:10px;border-radius:50%;background:#555;flex:none}
.sync.synced{background:var(--acc)}.sync.syncing{background:#f5c542}.sync.error{background:var(--red)}
main{padding:14px 14px 30px;max-width:640px;margin:0 auto}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(18,20,24,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
#tabs button{flex:1;min-width:0;padding:8px 0;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--acc)}
.card{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px;margin:0 0 12px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mut{color:var(--mut)}.sm{font-size:14px}.center{text-align:center}.block{display:block;width:100%}
.primary{display:block;width:100%;background:var(--acc);color:var(--accT);font-weight:700;border-radius:12px;padding:14px;margin:6px 0 12px;text-align:center}
.primary[disabled]{opacity:.4}
.big{font-size:17px;padding:16px}
.ghost{display:block;width:100%;background:var(--card2);border-radius:12px;padding:12px;margin:8px 0;font-weight:600;text-align:center}
.ghost.left{text-align:left}
.link{color:var(--acc);font-weight:600;padding:10px 0}
.red{color:var(--red)}
.month{color:var(--mut);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:18px 4px 8px}
.wcard b{font-size:17px}
.wcard .sm{margin-top:3px}
.empty{color:var(--mut);text-align:center;padding:40px 20px}
.whead{display:flex;gap:8px;margin-bottom:12px}
.whead .title{flex:1;font-size:19px;font-weight:700;background:transparent;padding:8px 4px}
.whead .title:focus{background:var(--card2)}
.whead input[type=date]{width:auto;flex:none;padding:8px 10px;font-size:15px}
input.title{font-size:20px;font-weight:700;margin-bottom:12px}
.exTop{display:flex;align-items:center;gap:8px}
.exName{flex:1;text-align:left;font-size:18px;font-weight:700;color:var(--acc)}
.icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:18px;flex:none}
.machine{display:block;width:100%;text-align:left;margin:8px 0 6px;padding:9px 12px;border-radius:10px;background:#1c2420;color:#d6f57a;font-size:14px;font-weight:600}
.machine.empty{background:var(--card2);color:var(--mut);font-weight:500}
.cue{font-size:14px;color:#c9ced6;background:var(--card2);border-radius:10px;padding:8px 12px;margin:0 0 6px;white-space:pre-wrap}
.last{font-size:13px;color:var(--mut);margin:6px 2px 8px}
.set{display:grid;grid-template-columns:28px 60px 46px minmax(0,1fr) 30px;gap:6px;align-items:center;margin:3px 0}
.set.head{font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.06em;margin:4px 0 0}
.set.head span{text-align:center}
.set .n{text-align:center;color:var(--mut);font-weight:700;font-size:14px;height:34px;border-radius:8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.set .n.wu{color:#ffb547;background:rgba(255,181,71,.12)}
.wtag{color:#ffb547;font-weight:700}
.set input{text-align:center;padding:5px 2px;height:34px;border-radius:8px;font-weight:600;font-size:16px}
.set .np{display:block;line-height:34px;padding:0;font-size:12px;color:var(--mut);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;height:34px}
.set .note{width:36px;height:34px;font-size:16px}
#top .home{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text);border-radius:10px;background:var(--card2)}
#top .home svg{width:20px;height:20px}
#top .trash{color:var(--red);background:rgba(255,107,107,.08);opacity:.75}
#top .trash svg{width:18px;height:18px}
.set.done input{background:var(--doneBg)}
.note.has{color:var(--acc)}
.noteRow{margin:0 0 8px 40px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.noteRow .link{padding:4px 2px;font-size:13px}
.wnotes{margin:4px 0 10px;min-height:70px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats span{font-size:12px;color:var(--mut)}
h3{margin:2px 0 10px;font-size:16px}
.rtTap{display:block;width:100%;text-align:left}
.rtTap b{font-size:17px}
.rtTap .sm{margin-top:3px}
.rtRow{display:grid;grid-template-columns:auto auto auto 1fr;gap:10px;align-items:center;margin-top:10px}
.stepper{display:flex;align-items:center;background:var(--card2);border-radius:10px}
.stepper button{width:38px;height:40px;font-size:20px;color:var(--acc);font-weight:700}
.stepper b{min-width:22px;text-align:center}
.rtRow input{padding:10px 8px;text-align:center}
.target{font-size:13px;color:#d6f57a;margin:6px 2px 0}
.startBtn{margin:12px 0 0;padding:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.th{width:64px;height:64px;border-radius:10px;background:#2a2f37 center/cover no-repeat;position:relative;flex:none}
.th.vid::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.th.big{width:calc((100% - 16px)/3);height:auto;aspect-ratio:1}
.addMedia{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;cursor:pointer;color:#c9ced6}
.noteRow .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mv{background:#000;border-radius:14px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.mv video,.mv img{width:100%;max-height:70vh;display:block;object-fit:contain}
.hmedia{color:var(--acc);font-weight:600}
.exFilter{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mut);padding:10px 4px 4px}
.exFilter b{color:var(--text)}
.exFilter .link{font-size:13px;color:var(--acc);font-weight:600;padding:4px 0}
.hmedia .vicon{width:15px;height:15px;vertical-align:-3px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;margin:10px 0}
.toggle input{width:auto;transform:scale(1.4)}
.ms{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{background:var(--card2);border-radius:20px;padding:7px 12px;font-size:13px;color:#c9ced6}
.lbl{display:block;font-size:13px;color:var(--mut);font-weight:700;margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.hist .sets{font-size:15px;margin-top:6px;line-height:1.6}
.hist .sets i{color:var(--mut);font-style:normal;font-size:13px}
.search{margin-bottom:12px}
.exrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exrow .sm{margin-top:2px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{flex:1;padding:9px;border-radius:8px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--accT)}
ol{padding-left:20px;margin:0 0 12px;color:#c9ced6}
ol li{margin-bottom:6px}
.filebtn{display:block;cursor:pointer}
#sheetWrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
#sheetWrap.on{display:flex}
#sheet{background:#15181d;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
#sheet h2{margin:0 0 10px;font-size:19px}
.pick{display:block;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line)}
.pick .sm{margin-top:2px}
.map{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.map select{padding:9px 8px;font-size:15px}
.preview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:14px 0;font-size:14px}
.preview .err{color:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#2a2f37;color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.card.ex{padding:12px 12px 6px}
.exTop .exName{color:var(--text);font-size:17px}
.exTop .icon{width:32px;height:32px;font-size:17px}
.icon.gear.has{color:var(--acc)}
.exTop .icon.gear{font-size:20px}
.mline{display:block;text-align:left;font-size:13px;color:#cfe88a;margin:0 0 4px;padding:0}
.cue{background:none;padding:0;margin:0 0 4px;font-size:13px;color:var(--mut)}
.target{margin:0 0 4px}
.set.head{font-size:10px;margin:6px 0 2px}
.set.head span:nth-child(4){text-align:left;padding-left:8px}
.set input.ni,.set.done input.ni{text-align:left;font-weight:400;font-size:16px;padding:5px 8px;background:var(--card2);color:var(--text);min-width:0}
.set .vid{color:var(--mut);opacity:.6}
.set .vid.has{color:var(--acc);opacity:1}
.vicon{width:18px;height:18px;flex:none;vertical-align:-4px}
.set.done input{background:transparent;color:var(--text)}
.set.done .n{color:var(--acc);font-size:16px}
.set.warm input{color:#9aa1ad}
.set.warm.done input{color:#b9bec7}
.set .n.wu{color:#d9a35a;background:rgba(255,181,71,.08)}
.set .note{width:30px;height:34px;font-size:15px}
.noteRow{margin:0 0 6px 34px}
.addSet{display:block;color:var(--acc);font-weight:600;font-size:14px;padding:8px 2px 6px}
</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<nav id="tabs">
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Workouts</button>
  <button data-tab="rt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Routines</button>
  <button data-tab="ex"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Exercises</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="sheetWrap"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const APP_VERSION=19;
const LS='liftlog.v1', LSV='liftlog.view';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const newId=()=>now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const localYmd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>localYmd(new Date());
function ymd(y,m,d){if(m<1||m>12||d<1||d>31||y<1900||y>2100)return null;return y+'-'+pad(m)+'-'+pad(d)}
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)}
function num(s){s=String(s??'').trim();if(!s)return NaN;s=s.replace(/(\d),(\d{1,2})(?!\d)/,'$1.$2');return parseFloat(s.replace(/[^\d.\-]/g,''))}
function fmtNum(n){if(n===''||n==null||isNaN(n))return '';return String(Math.round(n*10)/10)}
function fmtVol(v){return Math.round(v).toLocaleString()}
function prettyDate(d){const [y,m,dd]=d.split('-').map(Number);const dt=new Date(y,m-1,dd);const o={weekday:'short',month:'short',day:'numeric'};if(y!==new Date().getFullYear())o.year='numeric';return dt.toLocaleDateString(undefined,o)}
function shortDate(d){const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function monthLabel(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}
const blankSet=()=>({w:'',r:'',note:'',done:false});
const hasData=s=>s.w!==''||s.r!=='';
const isWork=s=>!s.warmup;

/* ---------- state ---------- */
let S={unit:'lb',unitAt:0,exercises:{},workouts:{},routines:{}};
let view={tab:'log',workoutId:null,exerciseId:null,routineId:null};
let sheetCtx=null; const openNotes=new Set();
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.exercises&&j.workouts)S=Object.assign(S,j)}catch(e){}
  if(!S.routines)S.routines={};
  try{const v=JSON.parse(localStorage.getItem(LSV));if(v&&v.tab)view=v}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function saveView(){try{localStorage.setItem(LSV,JSON.stringify(view))}catch(e){}}
const liveW=()=>Object.values(S.workouts).filter(w=>!w.deleted);
const liveEx=()=>Object.values(S.exercises).filter(e=>!e.deleted);
const liveR=()=>Object.values(S.routines||{}).filter(r=>!r.deleted).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const tgtLow=t=>{const m=String(t||'').match(/\d+/);return m?m[0]:''};
function touchR(r){r.updatedAt=now();markDirty('meta');saveLocal()}
const exName=id=>S.exercises[id]?.name||'Unknown exercise';
const sortW=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0);
function vol(w){let v=0;for(const en of w.entries)for(const s of en.sets){if(s.warmup)continue;const a=num(s.w),b=num(s.r);if(a&&b)v+=a*b}return v}
function fmtSet(s){return (s.warmup?'W ':'')+(s.w!==''?s.w:'BW')+' × '+(s.r!==''?s.r:'?')}
const normName=n=>String(n||'').trim().toLowerCase();
// Which routine a workout belongs to: its routine id, plus the routine's current name and the workout's own name
function routineKeys(w){if(!w)return null;const k=new Set();if(w.routineId){k.add('id:'+w.routineId);const r=S.routines[w.routineId];if(r&&!r.deleted&&normName(r.name))k.add('n:'+normName(r.name))}
  const n=normName(w.name);if(n&&n!=='workout')k.add('n:'+n);return k.size?k:null}
function sameRoutine(keys,w){if(!keys)return false;if(w.routineId&&keys.has('id:'+w.routineId))return true;const n=normName(w.name);if(n&&keys.has('n:'+n))return true;
  if(w.routineId){const r=S.routines[w.routineId];if(r&&keys.has('n:'+normName(r.name)))return true}return false}
// Last time this exercise was done. In a routine (or a named workout) only that routine's history counts; unnamed workouts use any history.
function lastFor(exId,cur){const keys=routineKeys(cur);let same=null,any=null;
  for(const w of liveW()){if(cur&&w.id===cur.id)continue;if(cur&&cur.date&&w.date>cur.date)continue;
    const en=w.entries.find(e=>e.exId===exId);if(!en)continue;const sets=en.sets.filter(hasData);if(!sets.length)continue;
    const c={date:w.date,createdAt:w.createdAt,sets,name:w.name};const newer=(a,b)=>!a||b.date>a.date||(b.date===a.date&&(b.createdAt||0)>(a.createdAt||0));
    if(newer(any,c))any=c;if(sameRoutine(keys,w)&&newer(same,c))same=c}
  if(keys){if(same)same.scoped=true;return same}if(any)any.scoped=false;return any}
function historyFor(exId){const out=[];for(const w of liveW().sort(sortW)){const en=w.entries.find(e=>e.exId===exId);if(!en)continue;const sets=en.sets.filter(s=>hasData(s)||(s.media&&s.media.length));if(sets.length)out.push({w,sets})}return out}
function lastUsedMap(){const m={};for(const w of liveW())for(const en of w.entries)if(!m[en.exId]||w.date>m[en.exId])m[en.exId]=w.date;return m}
function settingsSummary(ex){if(!ex)return '';if(typeof ex.machine==='string')return ex.machine.trim();return (ex.settings||[]).filter(x=>x.k||x.v).map(x=>(x.k?x.k+' ':'')+x.v).join(', ')}
function e1rm(s){if(s.warmup)return 0;const w=num(s.w),r=num(s.r);if(!w||!r||r>15)return 0;return r===1?w:w*(1+r/30)}

/* ---------- GitHub sync (private data repo) ---------- */
const LSG='liftlog.gh',LSGS='liftlog.ghsync';
let gh=null,syncState='local',flushing=false,flushTimer=null,lastSync=0,syncErr='';const dirty=new Set();
try{gh=JSON.parse(localStorage.getItem(LSG))||null}catch(e){}
let ghCache={};try{ghCache=JSON.parse(localStorage.getItem(LSGS))||{}}catch(e){}
function saveGhCache(){try{localStorage.setItem(LSGS,JSON.stringify(ghCache))}catch(e){}}
const monthOf=w=>'m-'+(w.date||'0000-00').slice(0,7);
function syncLabel(){if(!gh)return 'Saved on this phone only. Connect GitHub below to back up and sync automatically.';
  return {syncing:'Syncing with GitHub…',synced:'Synced to '+gh.repo+(lastSync?' · '+new Date(lastSync).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):''),error:'Couldn’t reach GitHub'+(syncErr?' ('+syncErr+')':'')+'. Changes are saved on this phone and will sync later.',local:'Connected to '+gh.repo}[syncState]}
function setSync(s,err){syncState=s;if(err!==undefined)syncErr=err;const d=$('#top .sync');if(d){d.className='sync '+s;d.title=syncLabel()}const l=$('#syncLine');if(l)l.textContent=syncLabel()}
function markDirty(k){dirty.add(k);if(!gh)return;clearTimeout(flushTimer);flushTimer=setTimeout(flush,3000)}
function touchW(w,prevMonth){w.updatedAt=now();markDirty(monthOf(w));if(prevMonth&&prevMonth!==monthOf(w))markDirty(prevMonth);saveLocal()}
function touchEx(e){e.updatedAt=now();markDirty('meta');saveLocal()}
function bodyFor(k){if(k==='meta')return {unit:S.unit,unitAt:S.unitAt||0,exercises:S.exercises,routines:S.routines};const ws={};for(const w of Object.values(S.workouts))if(monthOf(w)===k)ws[w.id]=w;return {workouts:ws}}
function makeIdx(k,b){if(k==='meta'){const ex={},rt={};for(const id in b.exercises||{})ex[id]=b.exercises[id].updatedAt||0;for(const id in b.routines||{})rt[id]=b.routines[id].updatedAt||0;return {ex,rt,unitAt:b.unitAt||0}}
  const o={};for(const id in b.workouts||{})o[id]=b.workouts[id].updatedAt||0;return o}
function b64(str){const by=new TextEncoder().encode(str);let s='';for(let i=0;i<by.length;i+=0x8000)s+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(s)}
function ghHeaders(extra){return Object.assign({Authorization:'Bearer '+gh.token,'X-GitHub-Api-Version':'2022-11-28'},extra||{})}
const ghUrl=p=>`https://api.github.com/repos/${gh.repo}/contents/${p}`;
async function ghFetch(url,opts){let r;try{r=await fetch(url,Object.assign({cache:'no-store'},opts))}catch(e){throw {code:'network',msg:'no connection'}}
  if(r.status===401)throw {code:'auth',msg:'token rejected'};if(r.status===403&&r.headers.get('x-ratelimit-remaining')!=='0')throw {code:'auth',msg:'token lacks access'};return r}
async function ghPut(k,body,keepalive){const name=k+'.json',path='data/'+name;
  const send=sha=>ghFetch(ghUrl(path),{method:'PUT',keepalive:!!keepalive,headers:ghHeaders({'Content-Type':'application/json'}),body:JSON.stringify({message:'Update '+name,content:b64(JSON.stringify(body)),sha:sha||undefined})});
  let r=await send(ghCache[name]&&ghCache[name].sha);
  if(r.status===409||r.status===422){const m=await ghFetch(ghUrl(path)+'?t='+now(),{headers:ghHeaders({Accept:'application/vnd.github+json'})});r=await send(m.ok?(await m.json()).sha:undefined)}
  if(!r.ok)throw {code:'http',msg:'error '+r.status};const j=await r.json();ghCache[name]={sha:j.content.sha,idx:makeIdx(k,body)};saveGhCache()}
async function flush(keepalive){if(!gh||flushing||!dirty.size)return;flushing=true;setSync('syncing');let failed=null;
  while(dirty.size){const k=dirty.values().next().value;dirty.delete(k);try{await ghPut(k,bodyFor(k),keepalive)}catch(e){dirty.add(k);failed=e;break}}
  flushing=false;
  if(failed){setSync('error',failed.msg||'');if(failed.code!=='auth')setTimeout(flush,30000)}else{lastSync=now();setSync('synced','');uploadMedia()}}
function mergeBody(k,b){
  if(k==='meta'){if((b.unitAt||0)>(S.unitAt||0)){S.unit=b.unit||'lb';S.unitAt=b.unitAt}
    for(const [key,src] of [['exercises',b.exercises||{}],['routines',b.routines||{}]])for(const id in src){const l=S[key][id];if(!l||(src[id].updatedAt||0)>(l.updatedAt||0))S[key][id]=src[id]}}
  else{const rw=b.workouts||{};for(const id in rw){const l=S.workouts[id];if(!l||(rw[id].updatedAt||0)>(l.updatedAt||0))S.workouts[id]=rw[id]}}}
async function pull(){if(!gh||flushing)return;setSync('syncing');
  try{const r=await ghFetch(ghUrl('data')+'?t='+now(),{headers:ghHeaders({Accept:'application/vnd.github+json'})});
    let list=[];if(r.status===404)list=[];else if(!r.ok)throw {code:'http',msg:'error '+r.status};else list=await r.json();
    const names=new Set();let metaIdx=null;const remoteIdx={};
    for(const f of list){if(!/\.json$/.test(f.name))continue;const k=f.name.slice(0,-5);names.add(f.name);let idx;
      if(ghCache[f.name]&&ghCache[f.name].sha===f.sha)idx=ghCache[f.name].idx;
      else{const rr=await ghFetch(ghUrl('data/'+f.name)+'?t='+now(),{headers:ghHeaders({Accept:'application/vnd.github.raw+json'})});if(!rr.ok)throw {code:'http',msg:'error '+rr.status};
        const b=await rr.json();mergeBody(k,b);idx=makeIdx(k,b);ghCache[f.name]={sha:f.sha,idx}}
      if(k==='meta')metaIdx=idx;else remoteIdx[k]=idx}
    for(const n in ghCache)if(!names.has(n))delete ghCache[n];saveGhCache();
    if(!metaIdx){if(Object.keys(S.exercises).length||Object.keys(S.routines).length)dirty.add('meta')}
    else{if((S.unitAt||0)!==(metaIdx.unitAt||0))dirty.add('meta');
      for(const id in S.exercises)if((S.exercises[id].updatedAt||0)!==metaIdx.ex[id])dirty.add('meta');
      for(const id in S.routines)if((S.routines[id].updatedAt||0)!==metaIdx.rt[id])dirty.add('meta')}
    for(const m in remoteIdx)for(const id in remoteIdx[m]){const l=S.workouts[id];if(!l||monthOf(l)!==m||(l.updatedAt||0)!==remoteIdx[m][id])dirty.add(m)}
    for(const w of Object.values(S.workouts)){const m=monthOf(w);if(!remoteIdx[m]||remoteIdx[m][w.id]!==(w.updatedAt||0))dirty.add(m)}
    saveLocal();lastSync=now();setSync('synced','');if(dirty.size)await flush();else uploadMedia();return true}
  catch(e){setSync('error',e.msg||'');return false}}
async function ghConnect(repo,token){repo=repo.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'').replace(/\.git$/,'');token=token.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Repo should look like shfriedland/lift-log-data');if(!token)return toast('Paste your token first');
  const prev=gh;gh={repo,token};let r;try{r=await ghFetch(`https://api.github.com/repos/${repo}`,{headers:ghHeaders({Accept:'application/vnd.github+json'})})}catch(e){gh=prev;return toast('GitHub said: '+(e.msg||'error'))}
  if(!r.ok){gh=prev;return toast(r.status===404?'Repo not found, or the token can’t see it':'GitHub said: error '+r.status)}
  try{localStorage.setItem(LSG,JSON.stringify(gh))}catch(e){}if(!prev||prev.repo!==repo){ghCache={};saveGhCache()}
  render();toast('Connected. Syncing…');const ok=await pull();render();if(ok)toast('Synced with GitHub')}
function ghDisconnect(){gh=null;try{localStorage.removeItem(LSG)}catch(e){}setSync('local','');render();toast('Disconnected. Your data is still on this phone.')}
document.addEventListener('visibilitychange',()=>{if(!gh)return;
  if(document.visibilityState==='hidden'){if(dirty.size){clearTimeout(flushTimer);flush(true)}return}
  if(!flushing&&!dirty.size){const a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))pull().then(ok=>{if(ok)render()})}});

/* ---------- media (videos & photos) ---------- */
const idb={p:null,open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('liftlog-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('m',mode);const q=fn(t.objectStore('m'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(k){return this.run('readonly',st=>st.get(k))},put(k,v){return this.run('readwrite',st=>st.put(v,k))},del(k){return this.run('readwrite',st=>st.delete(k))}};
function* allMedia(){for(const w of Object.values(S.workouts)){if(w.deleted)continue;for(const m of w.media||[])yield {m,w,arr:w.media};for(const en of w.entries)for(let j=0;j<en.sets.length;j++){const st=en.sets[j];for(const m of st.media||[])yield {m,w,arr:st.media,set:st,setNo:j+1,exId:en.exId}}}}
function findMedia(id){for(const x of allMedia())if(x.m.id===id)return x;return null}
const mediaCount=w=>(w.media||[]).length+w.entries.reduce((a,en)=>a+en.sets.reduce((b,st)=>b+(st.media||[]).length,0),0);
function thumbsHtml(list,big){return (list||[]).map(m=>`<button class="th ${m.type==='video'?'vid':''} ${big?'big':''}" data-a="viewMedia" data-id="${m.id}" style="${m.thumb?`background-image:url(${m.thumb})`:''}" aria-label="Open ${m.type}"></button>`).join('')}
function drawThumb(src,w,h,max){const sc=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c}
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>{URL.revokeObjectURL(u);rej()};i.src=u})}
async function prepImage(file){try{const i=await loadImg(file);const big=drawThumb(i,i.naturalWidth,i.naturalHeight,1600);const blob=await new Promise(r=>big.toBlob(r,'image/jpeg',.82));return {blob:blob||file,thumb:drawThumb(i,i.naturalWidth,i.naturalHeight,200).toDataURL('image/jpeg',.6)}}catch(e){return {blob:file,thumb:''}}}
function videoInfo(blob){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';const u=URL.createObjectURL(blob);let done=false;
  const fin=t=>{if(done)return;done=true;const d=isFinite(v.duration)?v.duration:0;URL.revokeObjectURL(u);res({thumb:t,dur:d})};
  v.onloadeddata=()=>{try{v.currentTime=Math.min(.5,(v.duration||1)/2)}catch(e){fin('')}};v.onseeked=()=>{try{fin(drawThumb(v,v.videoWidth,v.videoHeight,200).toDataURL('image/jpeg',.6))}catch(e){fin('')}};
  v.onerror=()=>fin('');setTimeout(()=>fin(''),7000);v.src=u;v.load()})}
async function addMediaFiles(files,target){const w=curW();if(!w||!files.length)return;let n=0;toast('Adding…');
  for(const f of files){const isVid=/^video\//.test(f.type)||/\.(mov|mp4|m4v)$/i.test(f.name);const id='md'+newId();let blob=f,thumb='',dur=0;
    if(isVid){const inf=await videoInfo(f);thumb=inf.thumb;dur=inf.dur}else{const p=await prepImage(f);blob=p.blob;thumb=p.thumb}
    const ext=isVid?((f.name.match(/\.(\w+)$/)||[,'mov'])[1].toLowerCase()):'jpg';
    try{await idb.put(id,blob)}catch(e){toast('Not enough space on this phone to save that');continue}
    const m={id,type:isVid?'video':'image',mime:blob.type||(isVid?'video/quicktime':'image/jpeg'),size:blob.size,dur:Math.round(dur),file:id+'.'+ext,thumb,createdAt:now(),synced:false};
    let arr;if(target.kind==='set'){const st=w.entries[+target.i].sets[+target.j];arr=st.media=st.media||[];openNotes.add(target.i+'-'+target.j)}else arr=w.media=w.media||[];
    arr.push(m);n++}
  if(n){touchW(w);render();toast(n===1?'Added':'Added '+n);uploadMedia()}}
async function getBlob(m){let b=null;try{b=await idb.get(m.id)}catch(e){}
  if(!b&&m.synced&&gh){const r=await ghFetch(ghUrl('media/'+m.file),{headers:ghHeaders({Accept:'application/vnd.github.raw+json'})});if(r.ok){b=await r.blob();b=new Blob([b],{type:m.mime});try{await idb.put(m.id,b)}catch(e){}}}
  return b}
let viewURL=null;
async function viewMedia(id){const f=findMedia(id);if(!f)return;sheetCtx={type:'media',id};
  const where=f.set?`${esc(exName(f.exId))} · set ${f.setNo}`:'Progress check';
  openSheet(`<div class="mv" id="mv">Loading…</div><div class="row" style="margin:10px 2px"><b>${where}</b><span class="mut sm">${prettyDate(f.w.date)}</span></div>
  <button class="ghost" data-a="shareMedia" data-id="${id}">Save to Photos / share</button><button class="link red center block" data-a="delMedia" data-id="${id}">Delete ${f.m.type}</button>`);
  let b=null;try{b=await getBlob(f.m)}catch(e){}const el=$('#mv');if(!el||!sheetCtx||sheetCtx.id!==id)return;
  if(!b){el.innerHTML=`<div class="sm" style="padding:30px;text-align:center">This ${f.m.type} is saved on the phone it was added from${f.m.type==='video'&&!f.m.synced?' (videos only back up to GitHub if you turn that on in Settings)':''}.</div>`;return}
  if(viewURL)URL.revokeObjectURL(viewURL);viewURL=URL.createObjectURL(b);
  el.innerHTML=f.m.type==='video'?`<video src="${viewURL}" controls playsinline autoplay></video>`:`<img src="${viewURL}" alt="">`}
async function deleteMedia(id){const f=findMedia(id);if(!f)return;f.arr.splice(f.arr.indexOf(f.m),1);touchW(f.w);try{await idb.del(id)}catch(e){}
  if(f.m.synced&&gh){try{const r=await ghFetch(ghUrl('media/'+f.m.file),{headers:ghHeaders({Accept:'application/vnd.github+json'})});if(r.ok){const sha=(await r.json()).sha;await ghFetch(ghUrl('media/'+f.m.file),{method:'DELETE',headers:ghHeaders({'Content-Type':'application/json'}),body:JSON.stringify({message:'Delete '+f.m.file,sha})})}}catch(e){}}}
function blobB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
const syncVideosOn=()=>{try{return localStorage.getItem('liftlog.syncvid')==='1'}catch(e){return false}};
let mediaBusy=false;
async function uploadMedia(){if(!gh||mediaBusy)return;mediaBusy=true;
  try{for(const {m,w} of [...allMedia()]){if(m.synced)continue;if(m.type==='video'&&(!syncVideosOn()||m.size>40e6))continue;
      const b=await idb.get(m.id).catch(()=>null);if(!b)continue;const content=await blobB64(b);
      const r=await ghFetch(ghUrl('media/'+m.file),{method:'PUT',headers:ghHeaders({'Content-Type':'application/json'}),body:JSON.stringify({message:'Add '+m.file,content})});
      if(r.ok||r.status===422){m.synced=true;touchW(w)}else break}}
  catch(e){}finally{mediaBusy=false}}

  if(view.tab==='log')m.innerHTML=view.workoutId?vWorkout():vLog();
  else if(view.tab==='ex')m.innerHTML=view.exerciseId?vExercise():vExList();
  else if(view.tab==='rt')m.innerHTML=view.routineId?vRoutine():vRoutines();
  else m.innerHTML=vSettings();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===view.tab));
  m.querySelectorAll('textarea').forEach(autoGrow);saveView()}

function autoGrow(t){t.style.height='auto';t.style.height=Math.max(42,t.scrollHeight+2)+'px'}

function vLog(){const ws=liveW().sort(sortW);
  let h=`<button class="primary big" data-a="newWorkout">+ Start workout</button>`;
  const prog=ws.reduce((a,w)=>a+(w.media||[]).length,0);if(prog)h+=`<button class="ghost" data-a="progressGallery">Progress checks (${prog})</button>`;
  if(!ws.length)h+=`<div class="empty">No workouts yet.<br>Start one, or bring in your Rep Count history from Settings.</div>`;
  let lm='';
  for(const w of ws){const mk=w.date.slice(0,7);if(mk!==lm){lm=mk;h+=`<div class="month">${monthLabel(mk)}</div>`}
    const names=w.entries.map(e=>exName(e.exId));const sets=w.entries.reduce((a,e)=>a+e.sets.filter(x=>hasData(x)&&isWork(x)).length,0);
    h+=`<button class="card wcard" data-a="openW" data-id="${w.id}"><div class="row"><b>${esc(w.name||'Workout')}</b><span class="mut sm">${prettyDate(w.date)}</span></div>
    <div class="mut sm">${esc(names.slice(0,4).join(', '))}${names.length>4?' +'+(names.length-4)+' more':''}${names.length?'':'No exercises yet'}</div>
    <div class="mut sm">${sets} sets · ${fmtVol(vol(w))} ${S.unit}${mediaCount(w)?` · <span class="hmedia">${mediaCount(w)} ${CAM_ICON}</span>`:''}</div></button>`}
  return h}

function timerText(w){if(!w)return '';const end=w.finishedAt||now();const ms=end-(w.createdAt||end);
  if(w.finishedAt||(w.date===today()&&ms<8*3600e3&&ms>=0)){const t=Math.floor(Math.max(0,ms)/1000),h=Math.floor(t/3600),m=Math.floor(t/60)%60,sec=t%60;return (h?h+':'+pad(m):m)+':'+pad(sec)+(w.finishedAt?' · done':'')}
  return prettyDate(w.date)}
setInterval(()=>{const el=document.getElementById('wtimer');if(el&&view.workoutId)el.textContent=timerText(S.workouts[view.workoutId])},1000);
function vWorkout(){const w=S.workouts[view.workoutId];if(!w||w.deleted){view.workoutId=null;return vLog()}
  let h='';

    ${ex&&ex.notes?`<div class="cue">${esc(ex.notes)}</div>`:''}

    <div class="set head"><span>SET</span><span>${S.unit.toUpperCase()}</span><span>REPS</span><span>NOTES</span><span></span></div>`;
    let wn=0;en.sets.forEach((s,j)=>{const ls=last&&last.sets[j];const key=i+'-'+j;if(!s.warmup)wn++;const done=s.w!==''&&s.r!=='';const hasM=s.media&&s.media.length;
      h+=`<div class="set ${done?'done':''} ${s.warmup?'warm':''}"><button class="n ${s.warmup?'wu':''}" data-a="toggleWarm" data-i="${i}" data-j="${j}" aria-label="${s.warmup?'Warm-up set':'Set '+wn}. Tap to switch warm-up, hold for options">${s.warmup?'W':(done?'✓':wn)}</button>

      <input inputmode="numeric" data-f="r" data-i="${i}" data-j="${j}" value="${esc(s.r)}" placeholder="${ls&&ls.r!==''?esc(ls.r):en.target?esc(tgtLow(en.target)):''}" aria-label="Reps">
      <input class="ni" data-f="note" data-i="${i}" data-j="${j}" value="${esc(s.note||'')}" aria-label="Note for ${s.warmup?'warm-up':'set '+wn}" autocomplete="off">
      <button class="icon note vid ${hasM?'has':''}" data-a="note" data-i="${i}" data-j="${j}" aria-label="Set video">${VID_ICON}</button></div>`;
      if(openNotes.has(key))h+=`<div class="noteRow">${s.media&&s.media.length?`<div class="thumbs">${thumbsHtml(s.media)}</div>`:''}
        <div class="tools"><label class="addMedia">${VID_ICON} Add video<input type="file" accept="video/*,image/*" data-media="set" data-i="${i}" data-j="${j}" hidden></label></div></div>`});
    h+=`<button class="addSet" data-a="addSet" data-i="${i}">+ Add set</button></div>`});

let imp=null;
function parseCSV(text){text=text.replace(/^﻿/,'');const first=(text.split(/\r?\n/).find(l=>l.trim()&&!/^sep=/i.test(l))||'');
  const cnt=c=>first.split(c).length;const d=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!=='')&&!/^sep=/i.test(r[0]||''))}
const FIELDS=[['date','Date / workout start',1],['exercise','Exercise',1],['weight','Weight'],['reps','Reps'],['note','Set note'],['workout','Workout name'],['category','Muscle group'],['duration','Duration (sec)'],['settype','Set type (warm-up)'],['unit','Weight unit'],['sets','Sets (if one row = several sets)']];
function guessMap(head){const L=head.map(h=>h.trim().toLowerCase());const used=new Set();
  const find=(...res)=>{for(const re of res){const i=L.findIndex((h,ix)=>!used.has(ix)&&re.test(h));if(i>=0){used.add(i);return i}}return -1};
  const m={};
  m.exercise=find(/^exercise( name)?$/,/exercise(?!.*note)/,/^(movement|lift)$/);
  m.date=find(/^date$/,/date/,/^day$/,/^(time|start|start time|timestamp)$/,/start/);
  m.reps=find(/^reps?$/,/^reps?\b/,/repetition/);
  m.weight=find(/^weight/,/weight|load/,/^(kg|lbs?)$/);
  m.note=find(/^(set )?notes?$/,/set ?note/,/^comments?$/);
  m.workout=find(/^workout( name)?$/,/workout ?name|routine|^session|^title$/,/^name$/);
  m.category=find(/categor|muscle|body ?part/);
  m.duration=find(/^duration|^seconds?$/);
  m.settype=find(/set ?type|warm/);
  m.unit=find(/unit/);
  m.sets=find(/^sets$/,/set ?count|num.*sets/);
  if(m.exercise<0)m.exercise=find(/^name$/);
  return m}
function parseDate(v,dmy){v=String(v??'').trim();if(!v)return null;let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return ymd(+m[1],+m[2],+m[3]);
  m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return dmy?ymd(y,+m[2],+m[1]):ymd(y,+m[1],+m[2])}
  if(/^\d{10,13}$/.test(v)){const t=+v;return localYmd(new Date(v.length===10?t*1000:t))}
  const t=Date.parse(v);return isNaN(t)?null:localYmd(new Date(t))}
function buildImport(){const m=imp.map;if(m.date<0||m.exercise<0)return {ok:false,err:'Pick which columns hold the Date and the Exercise.',workouts:[],setCount:0,skipped:0};
  let dmy=false;for(const row of imp.data){const mm=String(row[m.date]||'').trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]/);if(mm&&+mm[1]>12){dmy=true;break}}
  const wHead=m.weight>=0?String(imp.head[m.weight]||'').toLowerCase():'';
  const groups=[],seen={};let prevKey=null,setCount=0,skipped=0;
  for(const row of imp.data){const rawDate=String(row[m.date]??'').trim();const date=parseDate(rawDate,dmy);const exn=String(row[m.exercise]??'').trim();if(!date||!exn){skipped++;continue}
    let wRaw=m.weight>=0?String(row[m.weight]??'').trim():'',rRaw=m.reps>=0?String(row[m.reps]??'').trim():'';
    const x=wRaw.match(/^([\d.,]+)\s*(kg|lbs?)?\s*[x×]\s*(\d+)/i);if(x&&!rRaw){wRaw=x[1]+(x[2]||'');rRaw=x[3]}
    let w=num(wRaw);const r=num(rRaw);let note=m.note>=0?String(row[m.note]??'').trim():'';
    const dur=m.duration>=0?num(row[m.duration]):NaN;if(dur>0)note=(note?note+' · ':'')+fmtNum(dur)+'s';
    if(w===0&&isNaN(r))w=NaN;
    let u=imp.unitMode;if(u==='auto'){const src=(m.unit>=0?String(row[m.unit]||''):'')+' '+wRaw+' '+wHead;u=/kg|kilo/i.test(src)?'kg':/lb|pound/i.test(src)?'lb':S.unit}
    if(!isNaN(w)&&u!==S.unit)w=u==='kg'?w*2.20462:w/2.20462;if(!isNaN(w))w=Math.round(w*10)/10;
    const wname=m.workout>=0?String(row[m.workout]??'').trim():'';
    // a new workout starts whenever the workout name or its start time changes from the row above
    const sk=rawDate+'|'+wname;let g=groups[groups.length-1];
    if(sk!==prevKey){const n=seen[sk]=(seen[sk]||0)+1;const t=Date.parse(rawDate.replace(' ','T'));
      g={key:sk+(n>1?'#'+n:''),date,name:wname||'Workout',start:/\d:\d/.test(rawDate)&&!isNaN(t)?t:0,entries:[]};groups.push(g);prevKey=sk}
    let en=g.entries.find(e=>e.name.toLowerCase()===exn.toLowerCase());if(!en){en={name:exn,category:m.category>=0?String(row[m.category]??'').trim():'',sets:[]};g.entries.push(en)}
    let n=m.sets>=0?parseInt(row[m.sets],10):1;if(!(n>=1&&n<=20))n=1;const filled=!isNaN(w)||!isNaN(r);
    const wu=m.settype>=0&&/warm|^w$/i.test(String(row[m.settype]??'').trim());
    for(let k=0;k<n;k++){const st={w:isNaN(w)?'':String(w),r:isNaN(r)?'':String(Math.round(r)),note:k===0?note:'',done:filled};if(wu)st.warmup=true;en.sets.push(st);setCount++}}
  const workouts=groups.sort((a,b)=>a.date.localeCompare(b.date)||(a.start-b.start));
  return {ok:workouts.length>0,err:workouts.length?'':'No sets found with these columns. Try different column choices.',workouts,setCount,skipped}}
function previewHtml(r){if(!r.ok)return `<div class="err">${esc(r.err)}</div>`;
  const f=r.workouts[0],l=r.workouts[r.workouts.length-1],ex=new Set();r.workouts.forEach(w=>w.entries.forEach(e=>ex.add(e.name.toLowerCase())));
  const sample=l.entries.slice(0,3).map(e=>`<div><b>${esc(e.name)}</b>: ${e.sets.slice(0,4).map(s=>esc(fmtSet(s))).join(' · ')}${e.sets.length>4?' …':''}</div>`).join('');
  return `<div><b>${r.workouts.length}</b> workouts · <b>${r.setCount}</b> sets · <b>${ex.size}</b> exercises</div><div class="mut">${prettyDate(f.date)} → ${prettyDate(l.date)}${r.skipped?` · ${r.skipped} rows skipped`:''}</div>
  <div class="lbl" style="margin-top:10px">Most recent: ${esc(l.name)}, ${prettyDate(l.date)}</div>${sample}`}
function renderImport(){const r=buildImport();sheetCtx={type:'import'};
  openSheet(`<h2>Import workouts</h2><div class="mut sm">I matched the columns automatically. Check each one points to the right column in your file.</div>
  ${FIELDS.map(([k,l,req])=>`<label class="map"><span>${l}${req?' *':''}</span><select data-f="impmap" data-k="${k}"><option value="-1">— none —</option>${imp.head.map((h,i)=>`<option value="${i}" ${imp.map[k]===i?'selected':''}>${esc(h.trim()||'Column '+(i+1))}</option>`).join('')}</select></label>`).join('')}
  <label class="map"><span>Weights in the file are</span><select data-f="impunit">${[['auto','Auto-detect'],['lb','lb'],['kg','kg']].map(([v,t])=>`<option value="${v}" ${imp.unitMode===v?'selected':''}>${t}</option>`).join('')}</select></label>
  <div class="preview">${previewHtml(r)}</div>
  <button class="primary" data-a="doImport" ${r.ok?'':'disabled'}>Import ${r.ok?r.workouts.length+' workouts':''}</button><button class="ghost" data-a="closeSheet">Cancel</button>`)}
function startImport(text){const rows=parseCSV(text);if(rows.length<2){toast('That file doesn’t look like a CSV with workout rows.');return}
  const head=rows[0];imp={head,data:rows.slice(1),map:guessMap(head),unitMode:'auto'};renderImport()}
function doImport(){const r=buildImport();if(!r.ok)return;const byName={};for(const e of liveEx())byName[e.name.toLowerCase()]=e.id;
  for(const g of r.workouts){const id='imp'+hash(g.key);
    const entries=g.entries.map(en=>{let exId=byName[en.name.toLowerCase()];if(!exId){exId=newId();S.exercises[exId]={id:exId,name:en.name,category:en.category||'',settings:[],notes:'',createdAt:now(),updatedAt:now()};byName[en.name.toLowerCase()]=exId;markDirty('meta')}
      else if(en.category&&!S.exercises[exId].category){S.exercises[exId].category=en.category;touchEx(S.exercises[exId])}return {exId,sets:en.sets}});
    const prev=S.workouts[id];const w={id,date:g.date,name:g.name,entries,notes:prev?.notes||'',createdAt:g.start||prev?.createdAt||Date.parse(g.date+'T12:00:00')||now(),updatedAt:now(),imported:true};
    if(prev&&monthOf(prev)!==monthOf(w))markDirty(monthOf(prev));S.workouts[id]=w;markDirty(monthOf(w))}
  saveLocal();imp=null;view.tab='log';view.workoutId=null;closeSheet();toast(`Imported ${r.workouts.length} workouts and ${r.setCount} sets`)}

/* ---------- backup ---------- */
function mergeIn(o){if(!o||typeof o!=='object'||!o.exercises||!o.workouts)throw new Error('bad');
  for(const id in o.exercises){const r=o.exercises[id],l=S.exercises[id];if(r&&r.name&&(!l||(r.updatedAt||0)>(l.updatedAt||0)))S.exercises[id]=r}
  for(const id in o.workouts){const r=o.workouts[id],l=S.workouts[id];if(r&&r.date&&Array.isArray(r.entries)&&(!l||(r.updatedAt||0)>(l.updatedAt||0))){if(l)markDirty(monthOf(l));S.workouts[id]=r;markDirty(monthOf(r))}}
  for(const id in (o.routines||{})){const r=o.routines[id],l=S.routines[id];if(r&&Array.isArray(r.exercises)&&(!l||(r.updatedAt||0)>(l.updatedAt||0)))S.routines[id]=r}
  markDirty('meta');saveLocal()}
function restoreText(t){try{mergeIn(JSON.parse(t));closeSheet();toast('Backup restored')}catch(e){toast('That isn’t a Lift Log backup.')}}

/* ---------- actions ---------- */
const curW=()=>S.workouts[view.workoutId];
function go(v){Object.assign(view,v);openNotes.clear();render();window.scrollTo(0,0)}
function newWorkout(entries,name,routineId){const w={id:newId(),date:today(),name:name||'Workout',entries:entries||[],notes:'',createdAt:now(),updatedAt:now()};if(routineId)w.routineId=routineId;S.workouts[w.id]=w;touchW(w);sheetCtx=null;$('#sheetWrap').classList.remove('on');go({tab:'log',workoutId:w.id})}
function pickEx(id){if(sheetCtx&&sheetCtx.target==='replace'){const w=curW(),en=w&&w.entries[sheetCtx.i];if(en){en.exId=id;touchW(w)}closeSheet();return}
  if(sheetCtx&&sheetCtx.target==='routine'){const r=S.routines[view.routineId];if(r){r.exercises.push({exId:id,sets:3,warm:0,target:''});touchR(r)}closeSheet();return}
  const w=curW();if(!w)return;const last=lastFor(id,w);const n=last?last.sets.length:3;w.entries.push({exId:id,sets:Array.from({length:n},(_,j)=>Object.assign(blankSet(),last&&last.sets[j]&&last.sets[j].warmup?{warmup:true}:{}))});touchW(w);closeSheet()}
const ACT={
  back(){go({log:{workoutId:null},ex:{exerciseId:null},rt:{routineId:null}}[view.tab]||{})},
  newWorkout:sheetNew,
  startEmpty(){newWorkout()},
  startRepeat(d){const src=liveW().sort(sortW).find(w=>w.name===d.n);if(!src)return;newWorkout(src.entries.map(e=>{const ss=e.sets.filter(hasData);return {exId:e.exId,sets:ss.length?ss.map(x=>Object.assign(blankSet(),x.warmup?{warmup:true}:{})):[blankSet()]}}),src.name)},
  openW(d){go({workoutId:d.id})},
  openWfromEx(d){go({tab:'log',workoutId:d.id})},
  addEx(){sheetAddEx('workout')},
  addExR(){sheetAddEx('routine')},
  newRoutine(){const r={id:newId(),name:'New routine',exercises:[],createdAt:now()};S.routines[r.id]=r;touchR(r);go({routineId:r.id});const t=document.querySelector('input[data-f="rtname"]');if(t){t.focus();t.select()}},
  openR(d){go({routineId:d.id})},
  startR(d){const r=S.routines[d.id];if(!r)return;if(!r.exercises.length){toast('Add exercises to this routine first');go({tab:'rt',routineId:r.id});return}
    newWorkout(r.exercises.map(e=>{const warm=e.warm||0;const last=warm?null:lastFor(e.exId,{id:null,date:today(),name:r.name,routineId:r.id});
      return {exId:e.exId,target:e.target||'',sets:[...Array.from({length:warm},()=>Object.assign(blankSet(),{warmup:true})),...Array.from({length:Math.max(1,e.sets||3)},(_,j)=>Object.assign(blankSet(),last&&last.sets[j]&&last.sets[j].warmup?{warmup:true}:{}))]}}),r.name,r.id)},
  rtMove(d){const r=S.routines[view.routineId],i=+d.i,k=i+ +d.dir;[r.exercises[i],r.exercises[k]]=[r.exercises[k],r.exercises[i]];touchR(r);render()},
  rtRemove(d){const r=S.routines[view.routineId];r.exercises.splice(+d.i,1);touchR(r);render()},
  rtWarm(d){const e=S.routines[view.routineId].exercises[+d.i];e.warm=Math.min(10,Math.max(0,(e.warm||0)+ +d.d));touchR(S.routines[view.routineId]);render()},
  rtSets(d){const e=S.routines[view.routineId].exercises[+d.i];e.sets=Math.min(20,Math.max(1,(e.sets||3)+ +d.d));touchR(S.routines[view.routineId]);render()},
  delR(){const r=S.routines[view.routineId];confirmSheet(`Delete ${r.name}?`,'Past workouts from this routine stay in your log.','Delete routine',()=>{r.deleted=true;touchR(r);view.routineId=null})},
  saveAsRoutine(){const w=curW();let r=w.routineId&&S.routines[w.routineId]&&!S.routines[w.routineId].deleted?S.routines[w.routineId]:liveR().find(x=>x.name.toLowerCase()===(w.name||'').toLowerCase());
    const was=!!r;r=upsertRoutineFrom(w,r);w.routineId=r.id;touchW(w);render();toast(was?`Updated routine “${r.name}”`:`Saved routine “${r.name}”`)},
  routinesFromHistory(){const seen=new Set();let n=0;for(const w of liveW().sort(sortW)){const k=(w.name||'').toLowerCase();if(!w.entries.length||seen.has(k))continue;seen.add(k);upsertRoutineFrom(w,null);n++;if(n>=12)break}
    render();toast(`Made ${n} routine${n===1?'':'s'}. Tap one to edit it.`)},
  pickEx(d){pickEx(d.id)},
  replaceEx(d){sheetReplaceEx(+d.i)},
  exFilterAll(){sheetCtx.catOnly=false;renderExResults($('#exq')?.value||'')},
  exFilterCat(){sheetCtx.catOnly=true;renderExResults($('#exq')?.value||'')},
  createEx(d){const id=newId();S.exercises[id]={id,name:d.n,category:sheetCtx&&sheetCtx.catOnly?sheetCtx.cat:'',settings:[],notes:'',createdAt:now(),updatedAt:now()};touchEx(S.exercises[id]);pickEx(id)},
  newExSheet(){sheetCtx={type:'newEx'};openSheet(`<h2>New exercise</h2><input id="newExName" placeholder="e.g. Hammer Strength Chest Press" autocomplete="off"><button class="primary" style="margin-top:12px" data-a="createExStandalone">Create</button>`)},
  createExStandalone(){const n=($('#newExName')?.value||'').trim();if(!n)return;const dupe=liveEx().find(e=>e.name.toLowerCase()===n.toLowerCase());if(dupe){sheetCtx=null;$('#sheetWrap').classList.remove('on');go({exerciseId:dupe.id});return}
    const id=newId();S.exercises[id]={id,name:n,settings:[],notes:'',createdAt:now(),updatedAt:now()};touchEx(S.exercises[id]);sheetCtx=null;$('#sheetWrap').classList.remove('on');go({exerciseId:id})},
  openEx(d){go({exerciseId:d.id})},
  exHist(d){go({tab:'ex',exerciseId:d.id})},
  setMenu(d){const w=curW(),st=w.entries[+d.i].sets[+d.j];sheetCtx={type:'setMenu'};
    openSheet(`<h2>${esc(exName(w.entries[+d.i].exId))} · ${st.warmup?'warm-up':'set '+(w.entries[+d.i].sets.slice(0,+d.j+1).filter(isWork).length)}</h2>
    <button class="ghost left" data-a="toggleWarmSheet" data-i="${d.i}" data-j="${d.j}">${st.warmup?'Make it a working set':'Make it a warm-up'}</button>
    <button class="ghost left red" data-a="delSetSheet" data-i="${d.i}" data-j="${d.j}">Delete this set</button>`)},
  toggleWarmSheet(d){ACT.toggleWarm(d);closeSheet()},
  delSetSheet(d){ACT.delSet(d);closeSheet()},
  removeLastSet(d){const w=curW(),en=w.entries[+d.i];if(en.sets.length)en.sets.pop();openNotes.clear();touchW(w);closeSheet()},
  wInfo(){const w=curW();if(!w)return;sheetCtx={type:'wInfo'};openSheet(`<h2>Workout</h2><label class="lbl" style="margin-top:0">Name</label><input data-f="wname" value="${esc(w.name)}" placeholder="Workout name">
    <label class="lbl">Date</label><input type="date" data-f="wdate" value="${w.date}"><button class="primary" style="margin-top:14px" data-a="closeSheet">Done</button>`)},
  finishW(){const w=curW();if(w&&!w.finishedAt){w.finishedAt=now();touchW(w)}go({workoutId:null})},
  home(){sheetCtx=null;$('#sheetWrap').classList.remove('on');go({tab:'log',workoutId:null,exerciseId:null,routineId:null})},
  toggleWarm(d){const w=curW(),s=w.entries[+d.i].sets[+d.j];s.warmup=!s.warmup;if(!s.warmup)delete s.warmup;touchW(w);render()},
  addSet(d){const w=curW(),en=w.entries[+d.i],p=en.sets[en.sets.length-1];en.sets.push(p?{w:p.w,r:p.r,note:'',done:false}:blankSet());touchW(w);render()},
  note(d){const key=d.i+'-'+d.j;if(openNotes.has(key))openNotes.delete(key);else openNotes.add(key);render()},
  delSet(d){const w=curW();w.entries[+d.i].sets.splice(+d.j,1);openNotes.clear();touchW(w);render()},
  exMenu(d){const i=+d.i,w=curW(),en=w.entries[i];sheetCtx={type:'exMenu',i};
    openSheet(`<h2>${esc(exName(en.exId))}</h2><button class="ghost left" data-a="machine" data-id="${en.exId}">⚙︎ Machine settings</button><button class="ghost left" data-a="replaceEx" data-i="${i}">⇄ Replace exercise</button><button class="ghost left" data-a="exHist" data-id="${en.exId}">History &amp; PRs</button>${i>0?`<button class="ghost left" data-a="exMove" data-i="${i}" data-dir="-1">↑ Move up</button>`:''}${i<w.entries.length-1?`<button class="ghost left" data-a="exMove" data-i="${i}" data-dir="1">↓ Move down</button>`:''}${en.sets.length?`<button class="ghost left" data-a="removeLastSet" data-i="${i}">− Remove last set</button>`:''}<button class="ghost left red" data-a="exRemove" data-i="${i}">Remove from this workout</button>`)},
  exMove(d){const w=curW(),i=+d.i,k=i+ +d.dir;[w.entries[i],w.entries[k]]=[w.entries[k],w.entries[i]];touchW(w);closeSheet()},
  exRemove(d){const w=curW();w.entries.splice(+d.i,1);touchW(w);closeSheet()},
  machine(d){sheetMachine(d.id)},
  delW(){confirmSheet('Delete this workout?','This can’t be undone.','Delete workout',()=>{const w=curW();w.deleted=true;w.entries=[];touchW(w);view.workoutId=null})},
  delEx(){const ex=S.exercises[view.exerciseId];confirmSheet(`Delete ${ex.name}?`,'It disappears from your exercise list. Past workouts keep their sets.','Delete exercise',()=>{ex.deleted=true;touchEx(ex);view.exerciseId=null})},
  confirmOk(){const fn=sheetCtx&&sheetCtx.fn;if(fn)fn();closeSheet();window.scrollTo(0,0)},
  closeSheet,
  unit(d){S.unit=d.u;S.unitAt=now();markDirty('meta');saveLocal();render()},
  doImport,
  async copyBackup(){const txt=JSON.stringify({app:'liftlog',v:1,unit:S.unit,unitAt:S.unitAt,exercises:S.exercises,workouts:S.workouts,routines:S.routines});
    try{await navigator.clipboard.writeText(txt);toast('Backup copied. Paste it into Notes or a file to keep it.')}
    catch(e){sheetCtx={type:'copy'};openSheet(`<h2>Backup</h2><div class="mut sm">Select all of this text and copy it somewhere safe.</div><textarea readonly style="height:240px;font-size:12px">${esc(txt)}</textarea><button class="ghost" data-a="closeSheet">Close</button>`)}},
  downloadBackup(){const txt=JSON.stringify({app:'liftlog',v:1,unit:S.unit,unitAt:S.unitAt,exercises:S.exercises,workouts:S.workouts,routines:S.routines});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='lift-log-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup saved')},
  pasteRestore(){sheetCtx={type:'paste'};openSheet(`<h2>Restore backup</h2><textarea id="pasteBox" style="height:200px;font-size:13px" placeholder="Paste backup text here"></textarea><button class="primary" style="margin-top:12px" data-a="doPaste">Restore</button>`)},
  doPaste(){restoreText($('#pasteBox').value)},
  viewMedia(d){viewMedia(d.id)},
  delMedia(d){const f=findMedia(d.id);confirmSheet(`Delete this ${f?f.m.type:'item'}?`,'It’s removed from this workout and from your backup.','Delete',()=>deleteMedia(d.id))},
  async shareMedia(d){const f=findMedia(d.id);if(!f)return;const b=await getBlob(f.m);if(!b)return toast('Not available on this phone');
    const file=new File([b],f.m.file,{type:f.m.mime});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.m.file;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)},
  progressGallery(){const ws=liveW().filter(w=>(w.media||[]).length).sort(sortW);sheetCtx={type:'gallery'};
    openSheet(`<h2>Progress checks</h2>${ws.map(w=>`<div class="lbl">${prettyDate(w.date)} · ${esc(w.name||'')}</div><div class="thumbs">${thumbsHtml(w.media,true)}</div>`).join('')}`)},
  ghConnect(){ghConnect($('#ghRepo').value,$('#ghToken').value)},
  ghDisconnect(){confirmSheet('Disconnect GitHub on this phone?','Your data stays on this phone and in the repo. You’d need to paste the token again to reconnect.','Disconnect',ghDisconnect)},
  async syncNow(){const ok=await pull();if(ok){render();toast('Synced')}}
};

/* ---------- events ---------- */
let lpTimer=null,lpFired=false;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-a="toggleWarm"]');if(!b)return;lpFired=false;clearTimeout(lpTimer);lpTimer=setTimeout(()=>{lpFired=true;if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}ACT.setMenu(b.dataset)},500)});
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{if(ev==='pointermove'&&Math.abs(e.movementX)+Math.abs(e.movementY)<4)return;clearTimeout(lpTimer)}));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-a="toggleWarm"]'))e.preventDefault()});
document.addEventListener('click',e=>{if(e.target.id==='sheetWrap'){closeSheet();return}
  if(lpFired&&e.target.closest('[data-a="toggleWarm"]')){lpFired=false;return}
  const b=e.target.closest('[data-a],[data-tab]');if(!b)return;
  if(b.dataset.tab){const t=b.dataset.tab;if(t===view.tab)go({log:{workoutId:null},ex:{exerciseId:null},rt:{routineId:null}}[t]||{});else{view.tab=t;openNotes.clear();render();window.scrollTo(0,0)}return}
  const fn=ACT[b.dataset.a];if(fn)fn(b.dataset,b)});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(t.tagName==='TEXTAREA')autoGrow(t);
  if(t.id==='exq'){renderExResults(t.value);return}
  if(!f)return;
  if(f==='exlq'){const q=t.value.trim().toLowerCase();document.querySelectorAll('.exrow').forEach(el=>el.style.display=el.dataset.name.includes(q)?'':'none');
    document.querySelectorAll('[data-cat]').forEach(hd=>{let n=hd.nextElementSibling,any=false;while(n&&n.classList.contains('exrow')){if(n.style.display!=='none')any=true;n=n.nextElementSibling}hd.style.display=any?'':'none'});return}
  if(f==='impmap'){imp.map[t.dataset.k]=+t.value;renderImport();return}
  if(f==='impunit'){imp.unitMode=t.value;renderImport();return}
  if(f==='rtname'||f==='rttarget'){const r=S.routines[view.routineId];if(!r)return;if(f==='rtname')r.name=t.value;else r.exercises[+t.dataset.i].target=t.value.trim();touchR(r);return}
  if(['wname','wdate','wnotes','w','r','note'].includes(f)){const w=curW();if(!w)return;const pm=monthOf(w);
    if(f==='wname')w.name=t.value;else if(f==='wdate'){if(!t.value)return;w.date=t.value}else if(f==='wnotes')w.notes=t.value;
    else{const s=w.entries[+t.dataset.i].sets[+t.dataset.j];s[f]=t.value;
      if(f==='w'||f==='r'){s.done=s.w!==''&&s.r!=='';const row=t.closest('.set');if(row)row.classList.toggle('done',s.done)}}
    touchW(w,pm);return}
  const ex=S.exercises[t.dataset.id];if(!ex)return;
  if(f==='exname'){if(!t.value.trim())return;ex.name=t.value.trim()}
  else if(f==='exnotes')ex.notes=t.value;
  else if(f==='machine'){ex.machine=t.value;ex.settings=[]}
  else if(f==='excat')ex.category=t.value.trim();
  else if(f==='msk'||f==='msv'){const s=ex.settings[+t.dataset.k];if(!s)return;s[f==='msk'?'k':'v']=t.value;
    document.querySelectorAll(`[data-ms="${ex.id}"] input[data-f="${f}"][data-k="${t.dataset.k}"]`).forEach(o=>{if(o!==t)o.value=t.value})}
  touchEx(ex)});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.media){const files=[...(t.files||[])];t.value='';addMediaFiles(files,{kind:t.dataset.media,i:t.dataset.i,j:t.dataset.j});return}
  if(t.id==='syncVid'){try{localStorage.setItem('liftlog.syncvid',t.checked?'1':'0')}catch(e){}if(t.checked)uploadMedia();return}
  if(t.id!=='csvFile'&&t.id!=='jsonFile')return;const file=t.files&&t.files[0];if(!file)return;
  const rd=new FileReader();rd.onload=()=>{const txt=String(rd.result||'');if(t.id==='csvFile')startImport(txt);else restoreText(txt)};rd.onerror=()=>toast('Couldn’t read that file.');rd.readAsText(file);t.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newExName')ACT.createExStandalone();if(e.key==='Enter'&&e.target.id==='exq'){const first=$('#exResults [data-a]');if(first)first.click()}});

loadLocal();render();if(gh)pull().then(ok=>{if(ok)render()});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol==='https:'){const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadSW&&!reloaded&&!dirty.size){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{})}
</script>
