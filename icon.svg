<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 276">
  <!-- Lift Log app icon: a log book with a blue spine and a dumbbell. Full-bleed square: iOS rounds the corners.
       The PNG icons (icon-180/192/512.png) are rendered from this file. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161b"/>
      <stop offset="1" stop-color="#020203"/>
    </linearGradient>
  </defs>
  <rect width="276" height="276" fill="url(#tile)"/>
  <!-- book: edge, then page -->
  <rect x="60" y="43" width="157" height="190" rx="16" fill="#2a2a30"/>
  <rect x="64" y="47" width="149" height="182" rx="12" fill="#1c1c1f"/>
  <!-- spine -->
  <rect x="62" y="45" width="24" height="186" rx="12" fill="#5c8bf7"/>
  <!-- dumbbell -->
  <rect x="119" y="111" width="66" height="11" fill="#f4f4f5"/>
  <rect x="103" y="92" width="16" height="49" rx="5" fill="#5c8bf7"/>
  <rect x="185" y="92" width="16" height="49" rx="5" fill="#5c8bf7"/>
  <!-- text lines -->
  <rect x="106" y="166" width="87" height="8" rx="4" fill="#8e8e95"/>
  <rect x="106" y="185" width="60" height="8" rx="4" fill="#8e8e95"/>
</svg>
